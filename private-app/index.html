<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Private Finance Workstation</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="panel auth-panel" id="authPanel">
        <h1>Private Finance Workstation</h1>
        <p>로컬/비공개 배포용 대시보드다. 로그인 후 출처별 단계형 선택으로 데이터를 호출한다.</p>
        <form id="loginForm" class="form-grid">
          <label>
            <span>ID</span>
            <input id="usernameInput" type="text" autocomplete="username" />
          </label>
          <label>
            <span>Password</span>
            <input id="passwordInput" type="password" autocomplete="current-password" />
          </label>
          <button class="button primary" type="submit">로그인</button>
        </form>
        <p class="note">기본값은 `.env`의 `APP_USERNAME`, `APP_PASSWORD`를 사용한다. 없으면 `admin / change-me`다.</p>
      </section>

      <section class="panel hidden" id="appPanel">
        <div class="header-row">
          <div>
            <h1>Private Finance Workstation</h1>
            <p id="sessionText">세션 확인 중...</p>
          </div>
          <div class="header-actions">
            <button class="button subtle" id="logoutButton" type="button">로그아웃</button>
          </div>
        </div>

        <div class="source-tabs" id="sourceTabs"></div>
        <div id="sourcePanel" class="source-panel"></div>
      </section>
    </main>

    <template id="resultTableTemplate">
      <section class="result-panel">
        <h2>조회 결과</h2>
        <div class="table-wrap">
          <table>
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </template>

    <script type="module" src="./app.js"></script>
  </body>
  </html>
